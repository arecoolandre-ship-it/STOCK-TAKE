<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Take</title>
<style>
:root{--bg:#eef1f3;--card:#fff;--ink:#1d2b36;--mut:#5b6b78;--line:#d5dce1;--acc:#0b5fff;--warn:#b86e00;--bad:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#10171c;--card:#19232b;--ink:#e8eef2;--mut:#93a4b1;--line:#2b3943;--acc:#6ea0ff;--warn:#f0b24a;--bad:#ff7b7b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "IBM Plex Sans",system-ui,sans-serif;padding-bottom:70px}
header{position:sticky;top:0;background:var(--ink);color:var(--bg);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;z-index:5}
#st{font-size:13px;opacity:.85}main{max-width:560px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
input,button,select{font:inherit;color:inherit}
input,select{width:100%;padding:12px;border:2px solid var(--line);border-radius:6px;background:var(--bg)}input:focus,select:focus{outline:none;border-color:var(--acc)}
button{padding:12px 14px;border:0;border-radius:6px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--acc);border:1px solid var(--line)}button.r{background:transparent;color:var(--bad);padding:4px 8px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>button{flex:0 0 auto}
.hit{padding:10px;border-bottom:1px solid var(--line);cursor:pointer}.mut,.hit small{color:var(--mut)}
.uom{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:center;margin:8px 0}.uom input{text-align:right;font-size:20px}
.tot{font-size:22px;font-weight:700;margin:10px 0}.msg{padding:10px;border-radius:6px;margin:8px 0;border-left:4px solid var(--warn);background:var(--bg)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600}td.n,th.n{text-align:right}
h3{margin:14px 0 6px}h3:first-child{margin-top:0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:16px}nav button.on{color:var(--acc);box-shadow:inset 0 3px var(--acc)}
.hidden{display:none}
</style></head><body>
<header><b>Stock Take</b><span id="st"></span></header>
<main>
<section id="v-input">
 <div class="card"><p class="mut" style="margin:0 0 6px">Lokasi yang sedang dihitung</p><select id="lok"></select>
 <p class="mut" style="margin:12px 0 6px">Cari barang (SKU atau nama)</p><input id="q" placeholder="Ketik SKU atau nama" autocomplete="off"><div id="hits"></div></div>
 <div id="panel"></div>
</section>
<section id="v-hasil" class="hidden"><div class="card"><div id="list"></div><div class="row" style="margin-top:12px"><button id="sync">Kirim ke Sheets</button><button class="g" id="clr">Kosongkan</button></div></div></section>
<section id="v-set" class="hidden"><div class="card"><h3>Pengaturan</h3>
 <p class="mut">URL Web App dari Apps Script (berakhir /exec)</p><input id="url" placeholder="https://script.google.com/macros/s/.../exec">
 <p class="mut">Nama sesi (misal: Opname Nov)</p><input id="sesi">
 <div class="row" style="margin-top:10px"><button id="save">Simpan &amp; muat data barang</button></div><p id="info" class="mut"></p></div></section>
</main>
<nav><button data-v="input" class="on">Input</button><button data-v="hasil">Hasil (<span id="n">0</span>)</button><button data-v="set">Atur</button></nav>
<script>
const $=s=>document.querySelector(s),L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let M=L('m3',{master:[],lokasi:[]}),counts=L('c3',[]),cfg=L('cfg3',{url:'',sesi:'',lok:''}),cur=null;
const norm=s=>String(s).trim().toLowerCase(),fmt=n=>(+n).toLocaleString('id-ID',{maximumFractionDigits:4});
const lc=r=>Object.fromEntries(Object.entries(r).map(([k,v])=>[k.trim().toLowerCase(),String(v).trim()]));
// "1 CTN = 12 PCK" | "1 CTN = 12 PCK = 120 PCS" | "1 CTN = 12 PCK; 1 PCK = 10 PCS"
function units(base,txt){base=base.toUpperCase();const per={[base]:1},pr=[];
 String(txt||'').split(/[;\n]+/).forEach(c=>{const t=c.split('=').map(x=>x.trim().match(/^([\d.,]+)\s*(\D.*)$/)).filter(Boolean).map(m=>({a:parseFloat(m[1].replace(',','.')),u:m[2].trim().toUpperCase()}));for(let i=1;i<t.length;i++)pr.push([t[0],t[i]])});
 for(let k=0;k<4;k++)pr.forEach(([x,y])=>{if(per[x.u]&&!per[y.u])per[y.u]=per[x.u]*y.a/x.a;else if(per[y.u]&&!per[x.u])per[x.u]=per[y.u]*x.a/y.a});
 return Object.entries(per).sort((a,b)=>a[1]-b[1]).map(([u,p])=>({u,p}))}
const hasil=c=>c.q.reduce((s,x,i)=>s+x/c.units[i].p,0),hit=c=>c.q.map((x,i)=>x?x+' '+c.units[i].u:'').filter(Boolean).join(' ')||'0 '+c.base;
const items=()=>M.master.map(lc).filter(m=>m.sku).map(m=>({sku:m.sku,nama:m['nama barang'],base:(m.uom||'').toUpperCase(),conv:m['uom dasar']}));
function find(q){q=norm(q);if(!q)return[];const a=items(),ex=a.find(m=>norm(m.sku)===q);return ex?[ex]:a.filter(m=>norm(m.nama).includes(q)||norm(m.sku).includes(q)).slice(0,8)}
function render(){$('#n').textContent=counts.length;$('#st').textContent=(cfg.sesi||'tanpa sesi')+' · '+M.master.length+' barang';
 const ls=M.lokasi.map(lc).map(l=>l.lokasi||Object.values(l)[0]).filter(Boolean);
 $('#lok').innerHTML=ls.length?ls.map(l=>`<option${l===cfg.lok?' selected':''}>${l}</option>`).join(''):'<option value="">(isi tab LOKASI di Sheets lalu muat data)</option>';cfg.lok=$('#lok').value;
 const q=$('#q').value,h=find(q);
 $('#hits').innerHTML=!q?'':h.length?h.map(m=>`<div class="hit" data-s="${m.sku}"><b>${m.nama}</b><br><small>${m.sku} · ${m.base}</small></div>`).join(''):'<div class="msg">Barang tidak ditemukan di tab Master. Tambahkan di Sheets, lalu muat ulang di tab Atur.</div>';
 const by={};counts.forEach((c,i)=>(by[c.lok]=by[c.lok]||[]).push([c,i]));
 $('#list').innerHTML=counts.length?Object.keys(by).map(k=>`<h3>${k}</h3><table><tr><th>SKU</th><th>Nama</th><th>Hitungan</th><th class="n">Hasil</th><th></th></tr>`+by[k].map(([c,i])=>`<tr><td>${c.sku}</td><td>${c.nama}</td><td>${hit(c)}</td><td class="n"><b>${fmt(hasil(c))}</b> ${c.base}</td><td><button class="r" data-d="${i}">×</button></td></tr>`).join('')+'</table>').join(''):'<p class="mut">Belum ada hasil. Mulai dari tab Input.</p>';
 $('#url').value=cfg.url;$('#sesi').value=cfg.sesi}
function open_(sku){const m=items().find(x=>x.sku===sku),u=units(m.base,m.conv);cur={m,u};
 $('#panel').innerHTML=`<div class="card"><h3>${m.nama}</h3><div class="mut">${m.sku} · ${$('#lok').value||'pilih lokasi'}${u.length>1?' · '+m.conv:''}</div>`+u.map((x,i)=>`<div class="uom"><label>${x.u}</label><input data-i="${i}" type="number" inputmode="decimal" min="0" placeholder="0"></div>`).join('')+`<div id="warn"></div><div class="tot" id="tot">Hasil: 0 ${m.base}</div><div class="row"><button id="ok">Simpan hitungan</button><button class="g" id="x">Batal</button></div></div>`;
 $('#panel').querySelectorAll('input').forEach(e=>e.oninput=calc);$('#x').onclick=()=>{$('#panel').innerHTML='';cur=null};$('#ok').onclick=save;$('#hits').innerHTML='';$('input[data-i="0"]').focus()}
const qs=()=>[...document.querySelectorAll('#panel input')].map(e=>+e.value||0);
function calc(){const q=qs(),c={q,units:cur.u};$('#tot').textContent='Hasil: '+fmt(hasil(c))+' '+cur.m.base;
 const w=[];q.forEach((x,i)=>{if(i>0){const r=cur.u[i].p/cur.u[i-1].p;if(x>=r)w.push(`${x} ${cur.u[i].u} sudah sama dengan atau lebih dari 1 ${cur.u[i-1].u} (1 ${cur.u[i-1].u} = ${r} ${cur.u[i].u}).`)}});
 $('#warn').innerHTML=w.map(t=>`<div class="msg">${t} Pastikan angkanya benar.</div>`).join('')}
function save(){const lok=$('#lok').value;if(!lok)return alert('Pilih lokasi dulu. Isi tab LOKASI di Sheets, lalu muat data di tab Atur.');
 const q=qs(),m=cur.m;if(!q.some(Boolean)&&!confirm('Hitungan 0. Tetap simpan?'))return;
 const ex=counts.find(c=>c.sku===m.sku&&c.lok===lok);
 if(ex){if(!confirm(`${m.nama} di ${lok} sudah dihitung (${hit(ex)}). Tambahkan hitungan ini?`))return;ex.q=ex.q.map((x,i)=>x+q[i])}
 else counts.push({lok,sku:m.sku,nama:m.nama,base:m.base,units:cur.u,q});
 cfg.lok=lok;S('cfg3',cfg);S('c3',counts);$('#panel').innerHTML='';cur=null;$('#q').value='';render();$('#q').focus()}
$('#q').oninput=render;$('#lok').onchange=()=>{cfg.lok=$('#lok').value;S('cfg3',cfg)};
$('#q').onkeydown=e=>{if(e.key==='Enter'){const h=find($('#q').value);if(h.length===1)open_(h[0].sku)}};
$('#hits').onclick=e=>{const h=e.target.closest('.hit');if(h)open_(h.dataset.s)};
$('#list').onclick=e=>{const d=e.target.dataset.d;if(d!==undefined&&confirm('Hapus hitungan ini?')){counts.splice(+d,1);S('c3',counts);render()}};
$('#save').onclick=async()=>{cfg.url=$('#url').value.trim();cfg.sesi=$('#sesi').value.trim();S('cfg3',cfg);
 try{const r=await fetch(cfg.url);M=await r.json();if(!M.master)throw 0;S('m3',M);$('#info').textContent='Dimuat: '+M.master.length+' barang, '+M.lokasi.length+' lokasi.'}catch(e){$('#info').textContent='Gagal memuat. Periksa URL /exec dan pengaturan akses Web App (Anyone).'}render()};
$('#sync').onclick=async()=>{if(!counts.length)return;if(!cfg.url)return alert('Isi URL di tab Atur dulu.');
 const it=counts.map(c=>({lokasi:c.lok,sku:c.sku,nama:c.nama,hitungan:hit(c),hasil:Math.round(hasil(c)*1e4)/1e4,uom:c.base}));
 try{const r=await fetch(cfg.url,{method:'POST',body:JSON.stringify({action:'counts',sesi:cfg.sesi,items:it})});if(!r.ok)throw 0;counts=[];S('c3',counts);alert('Terkirim ke tab DATA INPUTAN.')}catch(e){alert('Gagal terkirim. Data tetap aman di HP, coba lagi saat ada sinyal.')}render()};
$('#clr').onclick=()=>{if(counts.length&&confirm('Kosongkan semua hasil di HP ini? Pastikan sudah terkirim.')){counts=[];S('c3',counts);render()}};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));['input','hasil','set'].forEach(v=>$('#v-'+v).classList.toggle('hidden',v!==b.dataset.v))});
render();if(!cfg.url)document.querySelector('nav button[data-v=set]').click();
</script></body></html>
